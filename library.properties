sentence=Universal standalone TFT, touch, sprite, TFT_eSPI_Button, and visual GUI driver for all ESP32 Cheap Yellow Display (CYD) resistive boards.
paragraph=Bundles high-speed display and touch drivers with runtime hardware auto-probing for 2.4", 2.8", 3.2", 3.5", and 4.0" CYD resistive boards (ILI9341, ST7789, ST7796, XPT2046, including Dual-USB and ELEGOO 2.8" variants). Features full TFT_eSPI and TFT_eSPI_Button drop-in compatibility, TFT_eSprite off-screen buffering, persistent NVS touch calibration, zero-boilerplate LVGL v8/v9 integration, PlatformIO/Visual Studio support, and seamless SquareLine Studio / EEZ Studio visual GUI builder support.
